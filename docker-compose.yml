name: telegramsales

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-telegramsales}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-telegramsales}
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      dockerfile: dockerfile
      target: runtime
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-telegramsales}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      APP_ROOT_ID: ${APP_ROOT_ID:?APP_ROOT_ID not set, see .env.example}
      APP_WORK_CHAT_ID: ${APP_WORK_CHAT_ID:?APP_WORK_CHAT_ID not set, see .env.example}
    depends_on:
      postgres:
        condition: service_healthy

  backup:
    image: postgres:17-alpine
    restart: unless-stopped
    entrypoint: ["/backup.sh"]
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGUSER: ${POSTGRES_USER:-postgres}
      PGPASSWORD: ${POSTGRES_PASSWORD:-postgres}
      PGDATABASE: ${POSTGRES_DB:-telegramsales}
      POSTGRES_DB: ${POSTGRES_DB:-telegramsales}
      BACKUP_INTERVAL: ${BACKUP_INTERVAL:-86400}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./deploy/backup.sh:/backup.sh:ro
      - ./deploy/restore.sh:/restore.sh:ro
      - postgres_backups:/backups
    depends_on:
      postgres:
        condition: service_healthy

  bot:
    build:
      context: .
      dockerfile: dockerfile
      target: ${BOT_TARGET:-dev}
    restart: unless-stopped
    environment:
      BOT_TOKEN: ${BOT_TOKEN:?BOT_TOKEN not set, see .env.example}
      BOT_DROP_PENDING_UPDATES: ${BOT_DROP_PENDING_UPDATES:-true}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-telegramsales}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
      APP_ROOT_ID: ${APP_ROOT_ID:?APP_ROOT_ID not set, see .env.example}
      APP_WORK_CHAT_ID: ${APP_WORK_CHAT_ID:?APP_WORK_CHAT_ID not set, see .env.example}
      APP_DEFAULT_LOCALE: ${APP_DEFAULT_LOCALE:-ru}
      APP_LOG_LEVEL: ${APP_LOG_LEVEL:-INFO}
      APP_LOG_JSON: ${APP_LOG_JSON:-false}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    develop:
      watch:
        - action: sync
          path: ./src
          target: /app/src
        - action: rebuild
          path: ./uv.lock
        - action: rebuild
          path: ./pyproject.toml

volumes:
  postgres_data:
  postgres_backups:
  redis_data:
