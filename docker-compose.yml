name: telegramsales

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-telegramsales}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-telegramsales}
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      dockerfile: dockerfile
      target: runtime
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-telegramsales}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
    depends_on:
      postgres:
        condition: service_healthy

  bot:
    build:
      context: .
      dockerfile: dockerfile
      target: ${BOT_TARGET:-dev}
    restart: unless-stopped
    environment:
      BOT_TOKEN: ${BOT_TOKEN:?BOT_TOKEN not set, see .env.example}
      BOT_ROOT_ID: ${BOT_ROOT_ID:?BOT_ROOT_ID not set, see .env.example}
      BOT_DROP_PENDING_UPDATES: ${BOT_DROP_PENDING_UPDATES:-true}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-telegramsales}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      APP_LOG_LEVEL: ${APP_LOG_LEVEL:-INFO}
      APP_LOG_JSON: ${APP_LOG_JSON:-false}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    develop:
      watch:
        - action: sync
          path: ./src
          target: /app/src
        - action: rebuild
          path: ./uv.lock
        - action: rebuild
          path: ./pyproject.toml

volumes:
  postgres_data:
